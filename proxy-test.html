
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Display Control Connection Test</title>
<style>
body {
  margin: 0;
  padding: 30px 18px;
  background: #101820;
  color: white;
  font-family: Arial, sans-serif;
}
.panel {
  max-width: 500px;
  margin: 40px auto;
  padding: 25px;
  background: #202c38;
  border-radius: 14px;
}
button {
  width: 100%;
  padding: 15px;
  margin-top: 15px;
  border: 0;
  border-radius: 8px;
  background: #24a36a;
  color: white;
  font-size: 16px;
  font-weight: bold;
}
#result {
  margin-top: 20px;
  padding: 14px;
  background: #121c25;
  border-radius: 8px;
  overflow-wrap: anywhere;
  line-height: 1.5;
}
</style>
</head>
<body>
<div class="panel">
<h2>Display Control Connection Test</h2>
<p>This checks the saved dashboard settings without showing your key.</p>
<button id="test">Run connection test</button>
<div id="result">Ready to test.</div>
</div>

<script>
document.getElementById("test").onclick = async function () {
  const result = document.getElementById("result");
  result.textContent = "Checking saved dashboard settings...";

  try {
    const url = localStorage.getItem("dcc_url");
    const key = localStorage.getItem("dcc_key");

    if (!url || !key) {
      const names = Object.keys(localStorage)
        .filter(k => /dcc|supabase/i.test(k));

      result.textContent =
        "Settings not found under the expected names. " +
        "Page: " + location.origin +
        ". Related saved setting names: " +
        (names.length ? names.join(", ") : "none found") +
        ". No key values are displayed.";
      return;
    }

    result.textContent = "Settings found. Testing Cloudflare...";

    const response = await fetch("/api/supabase-test", {
      method: "GET",
      headers: { "x-supabase-apikey": key },
      cache: "no-store"
    });

    const body = await response.text();

    if (!response.ok) {
      throw new Error("HTTP " + response.status + ": " + body);
    }

    result.textContent =
      "SUCCESS! Cloudflare reached Supabase. HTTP " +
      response.status + ".";
  } catch (error) {
    result.textContent = "TEST FAILED: " + error.message;
  }
};
</script>
</body>
</html>
